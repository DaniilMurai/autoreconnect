name: windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - run: cargo test --locked --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: autoreconnect-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/autoreconnect.exe
          if-no-files-found: error
