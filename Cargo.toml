[package]
name = "autoreconnect"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.17"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
tao = "0.37.2"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde-well-known", "local-offset", "macros"] }
tray-icon = "0.26.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
objc2 = "0.6.5"
objc2-core-location = { version = "0.3.2", default-features = false, features = ["CLLocationManager"] }
objc2-core-wlan = { version = "0.3.2", features = ["CWWiFiClient", "CWInterface", "CWNetwork", "CoreWLANTypes", "CoreWLANUtil"] }
objc2-foundation = "0.3.2"
security-framework = "3.7.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_IO",
] }
