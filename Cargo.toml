[package]
name = "autoreconnect"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.17"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "serde-well-known", "local-offset", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
objc2 = "0.6.5"
objc2-core-location = { version = "0.3.2", default-features = false, features = ["CLLocationManager"] }
objc2-core-wlan = { version = "0.3.2", features = ["CWWiFiClient", "CWInterface", "CoreWLANTypes", "CoreWLANUtil"] }
objc2-foundation = "0.3.2"
security-framework = "3.7.0"
